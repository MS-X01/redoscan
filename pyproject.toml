[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redoscan"
version = "1.1.0"
description = "Static + dynamic ReDoS scanner with 11 more vulnerability checks and a searchable HTML report."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mohammad Sadra Naderi"}]
keywords = ["redos", "regex", "security", "static-analysis", "denial-of-service", "appsec", "sast", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/MS-X01/redoscan"
Issues = "https://github.com/MS-X01/redoscan/issues"
Changelog = "https://github.com/MS-X01/redoscan/blob/main/CHANGELOG.md"

[project.scripts]
redoscan = "redoscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
